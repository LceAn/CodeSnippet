name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q python tests
      - run: python -m unittest discover -s tests -v
      - run: bash -n 'Shell/运行之初默认输出.sh'
      - run: shellcheck 'Shell/运行之初默认输出.sh'
